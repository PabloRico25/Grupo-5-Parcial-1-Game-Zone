<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameZone - Carrito</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1><img src="images/logo-gamezone.jpg" alt="Logo GameZone" class="logo"> GameZone</h1>
    <p>Tu tienda de videojuegos, rápida y desde el celular</p>
  </header>

  <nav>
    <a href="index.html">Inicio</a>
    <a href="catalogo.html">Catálogo</a>
    <a href="blogs.html">Blogs</a>
    <a href="nosotros.html">Nosotros</a>
    <a href="contacto.html">Contacto</a>
    <a href="registro.html">Registro</a>
    <a href="carrito.html">Carrito (<span id="carrito-contador">0</span>)</a>
    <a href="ingreso.html" id="nav-ingreso">Ingreso</a>
  </nav>

  <main>
    <section>
      <h2>Tu carrito</h2>

      <table class="admin-tabla" id="tabla-carrito">
        <thead>
          <tr>
            <th>Producto</th>
            <th>Precio</th>
            <th>Cantidad</th>
            <th>Subtotal</th>
            <th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <p id="carrito-vacio" hidden>Tu carrito está vacío. <a href="catalogo.html">Ver catálogo</a></p>

      <div class="carrito-resumen">
        <label for="cupon">Cupón de descuento</label>
        <input type="text" id="cupon" placeholder="Ej: GAMEZONE10">
        <button type="button" id="btn-cupon">Aplicar</button>
        <p class="error" id="error-cupon"></p>

        <p class="precio" id="carrito-total">Total: $0</p>
        <button type="button" id="btn-pagar">Pagar</button>
        <p class="error" id="carrito-mensaje"></p>
      </div>
    </section>
  </main>

  <footer>
    <p>GameZone &copy; 2026</p>
    <p>Contacto: contacto@gamezone.cl | +56 9 1234 5678</p>
  </footer>

  <script src="productos-data.js"></script>
  <script src="carrito-core.js"></script>
  <script src="sesion.js"></script>
  <script src="carrito.js"></script>
</body>
</html>
