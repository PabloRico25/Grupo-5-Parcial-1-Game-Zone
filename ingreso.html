<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameZone - Ingreso</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>GameZone</h1>
    <p>Tu zona geek y de videojuegos favorita</p>
  </header>

  <nav>
    <a href="index.html">Inicio</a>
    <a href="catalogo.html">Catálogo</a>
    <a href="blogs.html">Blogs</a>
    <a href="nosotros.html">Nosotros</a>
    <a href="contacto.html">Contacto</a>

    <a href="carrito.html">Carrito (<span id="carrito-contador">0</span>)</a>
    <a href="ingreso.html" id="nav-ingreso">Ingreso</a>
  </nav>

  <main>
    <section>
      <h2>Inicia sesión</h2>
            <p>Ingresa con tu correo y tu contraseña.</p>

      <form id="form-ingreso" novalidate>
        <label for="correo">Correo</label>
        <input type="email" id="correo" name="correo" autocomplete="email" maxlength="100">
        <p class="error" id="error-correo"></p>

        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" name="contrasena" autocomplete="current-password">
        <p class="error" id="error-contrasena"></p>

        <button type="submit">Ingresar</button>
        <p class="error" id="form-exito"></p>
      </form>

      <p class="form-extra">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
    </section>
  </main>

  <footer>
    <p>GameZone &copy 2026</p>
    <p>Contacto: contacto@gamezone.cl | +56 9 1234 5678</p>
  </footer>

  <script src="carrito-core.js"></script>
  <script src="sesion.js"></script>
  <script src="usuarios-data.js"></script>
  <script src="ingreso.js"></script>
</body>
</html>
